<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OceanLife Explorer</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- HowlerJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>


  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body class="text-white">

  <!-- Fondo animado -->
  <div class="ocean-bg"></div>
  <div class="ocean-layer">
   <img src="assets/decor/coral1.png" class="coral coral-left">
</div>


  <!-- Barra lateral -->
  <div id="depthBar" class="depth-bar">
    <div id="depthIndicator" class="depth-indicator"></div>
  </div>


  <div id="modal3D" class="modal">
      <div class="modal-content">
          <span class="close" onclick="close3D()">&times;</span>

          <model-viewer id="viewer"
            src=""
            auto-rotate
            camera-controls
            style="width:100%; height:100%;">
          </model-viewer>
      </div>
    </div>

    <header class="app-header">
      <h1 class="app-title">🌊 Ocean Explorer</h1>
      <p class="app-subtitle">Descubre la vida marina desde la superficie hasta las profundidades</p>
    </header>

  <!-- Contenedor central -->
  <main class="ml-20 flex flex-col justify-center items-center min-h-screen relative z-10">

    <!-- Tarjeta -->
    <div id="card" class="card w-80 p-4 shadow-lg text-center relative">
      <!-- dinámico -->
    </div>

    


    <!-- Flechas -->
    <div class="flex justify-between w-80 mt-4">
      <button id="prevBtn" class="nav-btn">&larr; Anterior</button>
      <button id="nextBtn" class="nav-btn">Siguiente &rarr;</button>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
